name: "kcgp_cb"
description: "세종충북도박문제예방치유센터 application"

publish_to: 'none'
version: 1.1.15+15 #앱 버전

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.1.0
  intl: ^0.20.2
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  record: ^6.1.2
  audioplayers: ^6.5.1
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  file_picker: ^8.1.7
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^5.0.1
  shared_preferences: ^2.5.4
  fl_chart: ^0.70.2
  dotted_line: ^3.2.3

  video_player: ^2.10.1
  youtube_player_flutter: ^9.1.3
  dio: ^5.9.0
  open_filex: ^4.7.0
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.1
  vibration: ^3.1.5
  flutter_svg: ^2.2.3
  google_fonts: ^7.0.2
  tutorial_coach_mark: ^1.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/logo/sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/applogo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/applogo.png"